<!doctype html>
<!--
  Stage for the product-tour videos. tools/video/tour.js loads this page, puts the real
  Setwel app in the frame, moves the cursor, writes the captions and records the frames.
  ?mode=wide (1920x1080, YouTube/Facebook) or ?mode=tall (1080x1920 at 2x, TikTok/Reels/Shorts).
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=block" rel="stylesheet">
<style>
  :root { --grad: linear-gradient(90deg, #e57a1c, #d65536 55%, #c9334e); --gold: #e3a548; }
  * { box-sizing: border-box; margin: 0; }
  html, body { overflow: hidden; background: #222b35; font-family: Inter, "Segoe UI", sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1400px 900px at 75% 30%, #4a5a6a 0%, #3e4c5a 35%, #1f2730 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; }
  #brand { position: absolute; display: flex; align-items: center; gap: 12px; font-weight: 700; }
  #brand img { display: block; }
  #brand span { color: var(--gold); }
  #cap { position: absolute; transition: none; }
  #cap h2 { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; line-height: 1.08; }
  #cap h2 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #cap p { color: #dfe5ea; margin-top: 8px; }
  #device { position: absolute; background: #10161c; box-shadow: 0 40px 90px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08); overflow: hidden; }
  #device .bar { height: 34px; background: #e9e4dd; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  #device .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  #device .bar b { margin-left: 18px; font: 500 13px Inter, sans-serif; color: #6b625a; background: #fff; border-radius: 6px; padding: 4px 14px; }
  #app { display: block; border: 0; background: #f6f1ea; }
  #cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; z-index: 20; pointer-events: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
  #ripple { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 3px solid #e57a1c; opacity: 0; z-index: 19; pointer-events: none; }
  #card { position: absolute; inset: 0; z-index: 30; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; opacity: 0;
    background: radial-gradient(1200px 800px at 50% 40%, #4a5a6a 0%, #2c3743 55%, #1a2129 100%); }
  #card img { width: 150px; height: 150px; }
  #card h1 { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; font-size: 84px; line-height: 1.05; margin-top: 20px; }
  #card h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #card p { font-size: 30px; color: #dfe5ea; margin-top: 16px; }
  #card .pill { margin-top: 30px; padding: 16px 34px; border-radius: 14px; background: var(--grad); font-weight: 800; font-size: 30px; }
  #card .small { font-size: 22px; color: var(--gold); margin-top: 16px; font-weight: 700; }

  /* Wide: 1412x794 CSS pixels, recorded at 1.36x = 1920x1080, so the app is large enough to read */
  body.wide #brand { left: 40px; top: 26px; font-size: 18px; } body.wide #brand img { width: 32px; height: 32px; }
  body.wide #cap { left: 40px; top: 70px; width: 1330px; } body.wide #cap h2 { font-size: 38px; } body.wide #cap p { font-size: 17px; margin-top: 6px; }
  body.wide #device { left: 156px; top: 166px; width: 1100px; border-radius: 12px; }
  body.wide #device .bar { height: 30px; }
  body.wide #app { width: 1100px; height: 588px; }
  body.wide #card img { width: 110px; height: 110px; } body.wide #card h1 { font-size: 62px; } body.wide #card p { font-size: 22px; }
  body.wide #card .pill { font-size: 22px; padding: 12px 26px; } body.wide #card .small { font-size: 16px; }
  body.wide #cursor { width: 24px; height: 24px; } body.wide #ripple { width: 38px; height: 38px; margin: -19px 0 0 -19px; }

  /* Tall: 540x960 CSS pixels, recorded at 2x = 1080x1920 */
  body.tall #brand { left: 30px; top: 32px; font-size: 16px; } body.tall #brand img { width: 30px; height: 30px; }
  body.tall #cap { left: 30px; top: 80px; width: 480px; } body.tall #cap h2 { font-size: 29px; } body.tall #cap p { font-size: 14px; margin-top: 6px; }
  body.tall #device { left: 75px; top: 250px; width: 390px; border-radius: 34px; padding: 10px; }
  body.tall #device .bar { display: none; }
  body.tall #app { width: 370px; height: 640px; border-radius: 26px; }
  body.tall #card img { width: 90px; height: 90px; } body.tall #card h1 { font-size: 46px; } body.tall #card p { font-size: 18px; padding: 0 30px; }
  body.tall #card .pill { font-size: 18px; padding: 12px 22px; } body.tall #card .small { font-size: 14px; }
  body.tall #cursor { width: 22px; height: 22px; } body.tall #ripple { width: 34px; height: 34px; margin: -17px 0 0 -17px; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" style="width:520px;height:520px;background:#e57a1c;right:-120px;top:-160px"></div>
  <div class="blob" style="width:460px;height:460px;background:#c9334e;right:180px;bottom:-200px"></div>
  <div class="blob" style="width:300px;height:300px;background:#e3a548;left:-80px;bottom:120px;opacity:.25"></div>
  <div id="brand"><img src="../../brand/setwel-logo-transparent.png" alt="">Setwel <span>Biz Suite</span></div>
  <div id="cap"><h2 id="capH"></h2><p id="capP"></p></div>
  <div id="device">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><b>Setwel Biz Suite</b></div>
    <iframe id="app" title="Setwel"></iframe>
  </div>
  <div id="ripple"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11.5-6.6 1.1 3.9 7.4-3 1.5-3.9-7.5L4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div id="card"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.body.classList.add(q.get('mode') === 'tall' ? 'tall' : 'wide');
  document.getElementById('app').src = q.get('app') || 'http://127.0.0.1:8150/app/';
  // Helpers the recorder calls
  window.stage = {
    caption(h, p) { document.getElementById('capH').innerHTML = h; document.getElementById('capP').innerHTML = p || ''; },
    capOpacity(o) { const c = document.getElementById('cap'); c.style.opacity = o; c.style.transform = `translateY(${(1 - o) * 14}px)`; },
    cursor(x, y, scale) { const c = document.getElementById('cursor'); c.style.transform = `translate(${x - 4}px, ${y - 2}px) scale(${scale || 1})`; },
    ripple(x, y, k) { const r = document.getElementById('ripple'); r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.opacity = k > 0 ? 1 - k : 0; r.style.transform = `scale(${0.4 + k})`; },
    card(html) { document.getElementById('card').innerHTML = html; },
    cardOpacity(o) { document.getElementById('card').style.opacity = o; },
  };
</script>
</body>
</html>
