[project]
name = "liquidity-hunter-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.3",
    "pyarrow==26.0.0",
    "matplotlib==3.10.7",
    "tabulate",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
